<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Programação Web - Eventos</title>

</head>
<body>

<div class="container">

    <section id="parte1">
        <h2>Parte 1 — onclick</h2>
        <button id="btnMensagem">Clique aqui</button>
    </section>

    <section id="parte2">
        <h2>Parte 2 — keyup</h2>
        <p><small><em>Nota: Abra o Console do Desenvolvedor (F12) para ver o resultado em tempo real.</em></small></p>
        <label for="campoTexto">Digite algo:</label>
        <input type="text" id="campoTexto" placeholder="Escreva aqui para ver no console...">
    </section>

    <section id="parte3">
        <h2>Parte 3 — change</h2>
        <label for="selectCurso">Selecione um Curso:</label>
        <select id="selectCurso">
            <option value="">-- Escolha uma opção --</option>
            <option value="Informática">Informática</option>
            <option value="Agropecuária">Agropecuária</option>
            <option value="Edificações">Edificações</option>
        </select>
    </section>

    <section id="desafio">
        <h2>Desafio — submit</h2>
        <form id="formCadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Seu nome completo">

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="seu.email@exemplo.com">

            <button type="submit">Enviar Cadastro</button>
        </form>
    </section>

</div>

<script>

    // Parte 1 — onclick
    document.getElementById('btnMensagem').addEventListener('click', function() {
        alert('Bem-vindo à Programação Web!');
    });

    // Parte 2 — keyup
    document.getElementById('campoTexto').addEventListener('keyup', function(event) {
        console.log(event.target.value);
    });

    // Parte 3 — change
    document.getElementById('selectCurso').addEventListener('change', function(event) {
        const cursoSelecionado = event.target.value;
        if (cursoSelecionado !== "") {
            alert('Curso escolhido: ' + cursoSelecionado);
        }
    });

    // Desafio — submit
    document.getElementById('formCadastro').addEventListener('submit', function(event) {
        event.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();

        if (nome === "" || email === "") {
            alert('Por favor, informe todos os campos obrigatórios (Nome e E-mail).');
        } else {
            alert('Cadastro realizado com sucesso!');
            this.reset();
        }
    });
</script>

</body>
</html>
