<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3 - Calcular Área</title>
    <style>body { font-family: Arial; margin: 40px; } input, button { margin: 5px; }</style>
</head>
<body>
    <h2>Função com Retorno (Calcular Área)</h2>
    <label>Base:</label> <input type="number" id="base" placeholder="Ex: 5"><br>
    <label>Altura:</label> <input type="number" id="altura" placeholder="Ex: 10"><br>
    <button onclick="mostrarArea()">Calcular Área</button>
    <p id="resultado3"></p>

    <script>
        function calcularArea(base, altura) {
            return base * altura;
        }

        function mostrarArea() {
            let b = Number(document.getElementById("base").value);
            let a = Number(document.getElementById("altura").value);

            let resultado = calcularArea(b, a); 
            
            document.getElementById("resultado3").innerText = `A área do retângulo é: ${resultado}`;
        }
    </script>
</body>
</html>
