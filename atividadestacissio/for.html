<!-- Crie um programa que exiba os números de 1 até 10 no console, um por linha. -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - For</title>
</head>
<body>

    <h1>Exercício 1: Números de 1 até 10</h1>
    <div id="resultado"></div>

    <script>
        let elemento = document.getElementById("resultado");
        
        for (let i = 1; i <= 10; i++) {
            elemento.innerHTML += i + "<br>";
            console.log(i); // Também exibe no console do navegador
        }
    </script>

</body>
</html>
